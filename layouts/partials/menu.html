<section id="menu-pane" class="menu text-center">
  {{ if not .IsNode }}
  <nav aria-label="Page navigation">
    <ul class="pagination justify-content-center">
      {{ if .Section }}
      {{ with .PrevInSection }}
      <li class="menu-item">
        <a class="menu-item" href="{{ .Permalink }}">&lt; prev</a>
      </li>
      {{ end }}

      <li class="menu-item">
        {{ if .PrevInSection}}
        <span class="menu-item">&nbsp;|&nbsp;</span>
        {{ end}}
        <a class="menu-item" href="{{ .Section | relURL }}">{{ .Section | lower }}</a>
        {{ if .NextInSection}}
        <span class="menu-item">&nbsp;|&nbsp;</span>
        {{ end}}
      </li>

      {{ with .NextInSection }}
      <li class="menu-item">
        <a class="menu-item" href="{{ .Permalink }}">next &gt;</a>
      </li>
      {{ end }}
      {{ end }}
    </ul>
  </nav>
```html
{{ end }}
<h4 class="text-center" style="margin-top: 3rem; margin-bottom: 3rem;">
    <a class="menu-item" href="{{ .Site.BaseURL }}" style="font-size: 25px;">home</a>
  </h4>
</section>
